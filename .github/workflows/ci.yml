name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ratchet compares with the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/railing.mjs gate --strict
